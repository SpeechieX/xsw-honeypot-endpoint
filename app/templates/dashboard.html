<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XSW Honeypot — Capture Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #080c10;
    --surface:   #0d1318;
    --border:    #1a2530;
    --border-hi: #243545;
    --text:      #c8d8e8;
    --muted:     #4a6070;
    --dim:       #2a3a48;

    --low:       #3a7a4a;
    --low-fg:    #7ddb9d;
    --med:       #7a5a10;
    --med-fg:    #f5c842;
    --high:      #8a2a18;
    --high-fg:   #ff6b4a;
    --crit:      #aa1020;
    --crit-fg:   #ff2a40;

    --accent:    #1a6aaa;
    --accent-hi: #2a9aee;
    --green:     #2aaa60;
    --scan:      rgba(26,106,170,0.08);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    line-height: 1.6;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Scanline effect */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.03) 2px,
      rgba(0,0,0,0.03) 4px
    );
    pointer-events: none;
    z-index: 9999;
  }

  /* ── Layout ──────────────────────────────────────────────────────── */
  .shell {
    display: grid;
    grid-template-rows: 56px 1fr;
    grid-template-columns: 220px 1fr;
    height: 100vh;
  }

  /* ── Header ──────────────────────────────────────────────────────── */
  header {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }

  header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent-hi), transparent);
    animation: sweep 4s linear infinite;
  }

  @keyframes sweep {
    from { transform: translateX(-100%); }
    to   { transform: translateX(100%); }
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.05em;
    color: #fff;
  }

  .logo span { color: var(--accent-hi); }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .header-meta {
    margin-left: auto;
    color: var(--muted);
    font-size: 11px;
  }

  .refresh-btn {
    background: transparent;
    border: 1px solid var(--border-hi);
    color: var(--accent-hi);
    padding: 4px 12px;
    font-family: inherit;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.05em;
  }

  .refresh-btn:hover {
    background: var(--accent);
    border-color: var(--accent-hi);
    color: #fff;
  }

  /* ── Sidebar ─────────────────────────────────────────────────────── */
  aside {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 16px 0;
    overflow-y: auto;
  }

  .nav-section {
    padding: 0 12px 8px;
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
    margin-top: 16px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 16px;
    cursor: pointer;
    color: var(--muted);
    transition: all 0.1s;
    border-left: 2px solid transparent;
    font-size: 12px;
  }

  .nav-item:hover { color: var(--text); background: rgba(255,255,255,0.03); }
  .nav-item.active { color: var(--accent-hi); border-left-color: var(--accent-hi); background: rgba(26,106,170,0.1); }

  .nav-badge {
    margin-left: auto;
    background: var(--crit);
    color: var(--crit-fg);
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 2px;
    font-weight: 700;
    display: none;
  }

  .nav-badge.visible { display: block; }

  /* ── Main ────────────────────────────────────────────────────────── */
  main {
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* ── Stat Cards ──────────────────────────────────────────────────── */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 14px 16px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .stat-card:hover { border-color: var(--border-hi); }

  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
  }

  .stat-card.total::before  { background: var(--accent-hi); }
  .stat-card.xsw::before    { background: var(--high-fg); }
  .stat-card.crit::before   { background: var(--crit-fg); }
  .stat-card.ips::before    { background: var(--green); }

  .stat-label {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .stat-value {
    font-family: 'Syne', sans-serif;
    font-size: 32px;
    font-weight: 800;
    color: #fff;
    line-height: 1;
  }

  .stat-sub {
    font-size: 10px;
    color: var(--muted);
    margin-top: 4px;
  }

  /* ── Panel ───────────────────────────────────────────────────────── */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
  }

  .panel-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .panel-header .icon { color: var(--accent-hi); }

  /* ── Table ───────────────────────────────────────────────────────── */
  .capture-table { width: 100%; border-collapse: collapse; }

  .capture-table th {
    text-align: left;
    padding: 8px 12px;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    font-weight: 500;
  }

  .capture-table td {
    padding: 9px 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
    font-size: 12px;
  }

  .capture-table tr:last-child td { border-bottom: none; }

  .capture-table tr {
    cursor: pointer;
    transition: background 0.1s;
  }

  .capture-table tr:hover td { background: rgba(255,255,255,0.02); }

  .capture-table tr.selected td { background: rgba(26,106,170,0.12); }

  /* ── Badges ──────────────────────────────────────────────────────── */
  .badge {
    display: inline-block;
    padding: 2px 7px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.06em;
    border-radius: 2px;
  }

  .badge-LOW      { background: var(--low);  color: var(--low-fg); }
  .badge-MEDIUM   { background: var(--med);  color: var(--med-fg); }
  .badge-HIGH     { background: var(--high); color: var(--high-fg); }
  .badge-CRITICAL { background: var(--crit); color: var(--crit-fg); animation: blink 1.5s step-end infinite; }

  @keyframes blink {
    50% { opacity: 0.6; }
  }

  .badge-xsw {
    background: rgba(26,106,170,0.3);
    color: var(--accent-hi);
  }

  /* ── Detail Panel ────────────────────────────────────────────────── */
  .detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    padding: 16px;
  }

  .detail-section { display: flex; flex-direction: column; gap: 8px; }

  .detail-row {
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }

  .detail-key {
    min-width: 120px;
    color: var(--muted);
    font-size: 11px;
    flex-shrink: 0;
  }

  .detail-val {
    color: var(--text);
    font-size: 12px;
    word-break: break-all;
  }

  /* ── Indicators list ─────────────────────────────────────────────── */
  .indicator-item {
    padding: 8px 12px;
    border-left: 3px solid var(--border-hi);
    margin: 4px 16px;
    background: rgba(0,0,0,0.2);
    transition: border-color 0.2s;
  }

  .indicator-item:hover { border-color: var(--accent-hi); }

  .indicator-type {
    font-size: 11px;
    font-weight: 700;
    color: var(--accent-hi);
    letter-spacing: 0.05em;
  }

  .indicator-desc {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  .indicator-score {
    float: right;
    font-size: 10px;
    color: var(--high-fg);
  }

  /* ── XML viewer ──────────────────────────────────────────────────── */
  .xml-viewer {
    margin: 0 16px 16px;
    background: #050709;
    border: 1px solid var(--border);
    padding: 12px;
    font-size: 11px;
    color: #8ab4d0;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 300px;
    overflow-y: auto;
    line-height: 1.8;
  }

  /* ── Variants ────────────────────────────────────────────────────── */
  .variant-chip {
    display: inline-block;
    padding: 3px 10px;
    margin: 2px;
    background: rgba(255,42,64,0.15);
    border: 1px solid rgba(255,42,64,0.3);
    color: var(--crit-fg);
    font-size: 11px;
    font-weight: 700;
  }

  /* ── Empty state ─────────────────────────────────────────────────── */
  .empty-state {
    padding: 48px;
    text-align: center;
    color: var(--muted);
  }

  .empty-state .big { font-size: 40px; margin-bottom: 8px; }
  .empty-state p { font-size: 12px; }

  /* ── Loading ─────────────────────────────────────────────────────── */
  .loading {
    padding: 32px;
    text-align: center;
    color: var(--muted);
  }

  /* ── Score bar ───────────────────────────────────────────────────── */
  .score-bar-bg {
    height: 4px;
    background: var(--dim);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 4px;
  }

  .score-bar-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.6s ease;
  }

  /* ── Monospace values ────────────────────────────────────────────── */
  .mono { font-family: 'JetBrains Mono', monospace; }
  .dim { color: var(--muted); }
  .hi  { color: #fff; }

  /* ── Scrollbar ───────────────────────────────────────────────────── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }
</style>
</head>
<body>

<div class="shell">
  <!-- ── Header ─────────────────────────────────────────────────── -->
  <header>
    <div class="status-dot"></div>
    <div class="logo">XSW <span>HONEYPOT</span></div>
    <div style="color: var(--muted); font-size: 11px; margin-left: 8px;">CAPTURE DASHBOARD</div>
    <div class="header-meta" id="last-updated">—</div>
    <button class="refresh-btn" onclick="loadAll()">⟳ REFRESH</button>
  </header>

  <!-- ── Sidebar ────────────────────────────────────────────────── -->
  <aside>
    <div class="nav-section">Views</div>
    <div class="nav-item active" onclick="showView('captures')" id="nav-captures">
      ◈ All Captures
      <span class="nav-badge" id="crit-badge">0</span>
    </div>
    <div class="nav-item" onclick="showView('stats')" id="nav-stats">
      ◇ Statistics
    </div>

    <div class="nav-section">Filter</div>
    <div class="nav-item" onclick="filterSeverity('CRITICAL')" id="nav-crit">
      ◆ Critical
    </div>
    <div class="nav-item" onclick="filterSeverity('HIGH')" id="nav-high">
      ◆ High
    </div>
    <div class="nav-item" onclick="filterSeverity('MEDIUM')" id="nav-med">
      ◆ Medium
    </div>
    <div class="nav-item" onclick="filterSeverity('LOW')" id="nav-low">
      ◆ Low
    </div>
    <div class="nav-item" onclick="filterXSW()" id="nav-xsw">
      ⚠ XSW Only
    </div>
    <div class="nav-item" onclick="clearFilter()" id="nav-all-filter">
      ○ Clear Filter
    </div>
  </aside>

  <!-- ── Main ───────────────────────────────────────────────────── -->
  <main id="main-content">
    <div class="loading">Initializing...</div>
  </main>
</div>

<script>
// ── State ─────────────────────────────────────────────────────────────────
let captures = [];
let stats = {};
let selectedId = null;
let currentView = 'captures';
let currentFilter = null;
let filterXswOnly = false;

// ── Data Loading ──────────────────────────────────────────────────────────
async function loadAll() {
  try {
    const [capturesRes, statsRes] = await Promise.all([
      fetch('/api/captures?limit=200'),
      fetch('/api/stats'),
    ]);
    captures = capturesRes.ok ? await capturesRes.json() : [];
    stats = statsRes.ok ? await statsRes.json() : {};
    updateBadges();
    render();
    document.getElementById('last-updated').textContent =
      'Updated: ' + new Date().toLocaleTimeString();
  } catch (e) {
    document.getElementById('main-content').innerHTML =
      `<div class="loading" style="color:var(--high-fg)">⚠ API unreachable: ${e.message}</div>`;
  }
}

function updateBadges() {
  const critCount = stats.critical_count || 0;
  const badge = document.getElementById('crit-badge');
  badge.textContent = critCount;
  badge.classList.toggle('visible', critCount > 0);
}

// ── Filtering ─────────────────────────────────────────────────────────────
function filterSeverity(level) {
  currentFilter = level;
  filterXswOnly = false;
  currentView = 'captures';
  render();
}

function filterXSW() {
  filterXswOnly = true;
  currentFilter = null;
  currentView = 'captures';
  render();
}

function clearFilter() {
  currentFilter = null;
  filterXswOnly = false;
  render();
}

function getFilteredCaptures() {
  let list = captures;
  if (currentFilter) list = list.filter(c => c.xsw_analysis.severity === currentFilter);
  if (filterXswOnly) list = list.filter(c => c.xsw_analysis.is_xsw_suspected);
  return list;
}

// ── Views ─────────────────────────────────────────────────────────────────
function showView(view) {
  currentView = view;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('nav-' + view)?.classList.add('active');
  render();
}

function render() {
  if (currentView === 'stats') {
    renderStats();
  } else {
    renderCaptures();
  }
}

// ── Captures View ─────────────────────────────────────────────────────────
function renderCaptures() {
  const main = document.getElementById('main-content');
  const list = getFilteredCaptures();
  const filterLabel = currentFilter ? ` — ${currentFilter}` :
                      filterXswOnly ? ' — XSW Suspected' : '';

  if (list.length === 0) {
    main.innerHTML = `
      <div class="empty-state">
        <div class="big">◈</div>
        <p>No captures yet${filterLabel}.</p>
        <p style="margin-top:8px">Send a SAML POST to <code style="color:var(--accent-hi)">/saml/acs</code> to see captures here.</p>
      </div>`;
    return;
  }

  const tableRows = list.map(c => {
    const sev = c.xsw_analysis.severity;
    const time = new Date(c.captured_at + 'Z').toLocaleString();
    const issuer = c.issuer ? truncate(c.issuer, 30) : '<span class="dim">—</span>';
    const nameId = c.name_id ? truncate(c.name_id, 24) : '<span class="dim">—</span>';
    const variants = c.xsw_analysis.variant_guesses.join(', ') || '<span class="dim">—</span>';
    const xswFlag = c.xsw_analysis.is_xsw_suspected ?
      '<span class="badge badge-xsw">XSW</span>' : '';
    const selClass = selectedId === c.id ? 'selected' : '';
    return `
      <tr class="${selClass}" onclick="selectCapture('${c.id}')">
        <td><span class="mono dim">${c.id.slice(0,8)}</span></td>
        <td class="dim" style="font-size:11px">${time}</td>
        <td>${c.request.source_ip}</td>
        <td>${issuer}</td>
        <td>
          <span class="badge badge-${sev}">${sev}</span>
          <span style="color:var(--muted);font-size:10px;margin-left:4px">${c.xsw_analysis.severity_score}</span>
        </td>
        <td>${xswFlag} ${variants}</td>
      </tr>`;
  }).join('');

  const detail = selectedId
    ? renderDetailHTML(list.find(c => c.id === selectedId))
    : '';

  main.innerHTML = `
    <div class="panel">
      <div class="panel-header">
        <span class="icon">◈</span>
        CAPTURES${filterLabel}
        <span class="dim" style="margin-left:auto">${list.length} records</span>
      </div>
      <table class="capture-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>TIME</th>
            <th>SOURCE IP</th>
            <th>ISSUER</th>
            <th>SEVERITY</th>
            <th>XSW / VARIANTS</th>
          </tr>
        </thead>
        <tbody>${tableRows}</tbody>
      </table>
    </div>
    ${detail}`;
}

function selectCapture(id) {
  selectedId = selectedId === id ? null : id;
  renderCaptures();
  if (selectedId) {
    document.querySelector('.panel:last-child')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function renderDetailHTML(c) {
  if (!c) return '';
  const a = c.xsw_analysis;
  const scoreColor = a.severity_score >= 80 ? 'var(--crit-fg)' :
                     a.severity_score >= 50 ? 'var(--high-fg)' :
                     a.severity_score >= 20 ? 'var(--med-fg)'  : 'var(--low-fg)';

  const variantChips = a.variant_guesses.length
    ? a.variant_guesses.map(v => `<span class="variant-chip">${v}</span>`).join('')
    : '<span class="dim">None detected</span>';

  const indicatorItems = a.indicators.length
    ? a.indicators.map(i => `
        <div class="indicator-item">
          <span class="indicator-score">+${i.severity_contribution}</span>
          <div class="indicator-type">${i.indicator_type}</div>
          <div class="indicator-desc">${i.description}</div>
          ${i.xpath ? `<div class="indicator-desc" style="color:var(--accent-hi);margin-top:2px">xpath: ${i.xpath}</div>` : ''}
        </div>`).join('')
    : '<div class="dim" style="padding:12px 16px">No indicators detected.</div>';

  const xmlPreview = c.raw_xml
    ? escapeHtml(c.raw_xml.slice(0, 2000)) + (c.raw_xml.length > 2000 ? '\n... (truncated)' : '')
    : '<span class="dim">XML unavailable (malformed or decode failure)</span>';

  const attrRows = Object.entries(c.attributes || {}).map(([k, v]) =>
    `<div class="detail-row"><span class="detail-key">${escapeHtml(k)}</span><span class="detail-val">${v.join(', ')}</span></div>`
  ).join('') || '<span class="dim">None</span>';

  return `
    <div class="panel">
      <div class="panel-header">
        <span class="icon">◇</span>
        CAPTURE DETAIL — <span style="color:var(--accent-hi)">${c.id.slice(0,8)}</span>
      </div>
      <div class="detail-grid">
        <div class="detail-section">
          <div style="font-size:10px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:4px">Request</div>
          <div class="detail-row"><span class="detail-key">Captured At</span><span class="detail-val">${new Date(c.captured_at + 'Z').toLocaleString()}</span></div>
          <div class="detail-row"><span class="detail-key">Source IP</span><span class="detail-val hi">${c.request.source_ip}</span></div>
          <div class="detail-row"><span class="detail-key">User Agent</span><span class="detail-val">${c.request.user_agent || '<span class="dim">—</span>'}</span></div>
          <div class="detail-row"><span class="detail-key">Relay State</span><span class="detail-val">${c.relay_state || '<span class="dim">—</span>'}</span></div>

          <div style="font-size:10px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-top:12px;margin-bottom:4px">SAML Fields</div>
          <div class="detail-row"><span class="detail-key">Issuer</span><span class="detail-val">${c.issuer || '<span class="dim">—</span>'}</span></div>
          <div class="detail-row"><span class="detail-key">NameID</span><span class="detail-val">${c.name_id || '<span class="dim">—</span>'}</span></div>
          <div class="detail-row"><span class="detail-key">NameID Format</span><span class="detail-val dim">${c.name_id_format ? c.name_id_format.split(':').pop() : '—'}</span></div>
          <div class="detail-row"><span class="detail-key">Assertion ID</span><span class="detail-val">${c.assertion_id || '<span class="dim">—</span>'}</span></div>
          <div class="detail-row"><span class="detail-key">Audience</span><span class="detail-val">${c.audience || '<span class="dim">—</span>'}</span></div>
          <div class="detail-row"><span class="detail-key">Not Before</span><span class="detail-val dim">${c.not_before || '—'}</span></div>
          <div class="detail-row"><span class="detail-key">Expires</span><span class="detail-val dim">${c.not_on_or_after || '—'}</span></div>
          <div style="font-size:10px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-top:12px;margin-bottom:4px">Attributes</div>
          ${attrRows}
        </div>

        <div class="detail-section">
          <div style="font-size:10px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:4px">XSW Analysis</div>
          <div class="detail-row">
            <span class="detail-key">Severity</span>
            <span class="detail-val">
              <span class="badge badge-${a.severity}">${a.severity}</span>
              <span style="color:${scoreColor};margin-left:6px;font-weight:700">${a.severity_score}/100</span>
              <div class="score-bar-bg" style="width:120px;margin-top:4px">
                <div class="score-bar-fill" style="width:${a.severity_score}%;background:${scoreColor}"></div>
              </div>
            </span>
          </div>
          <div class="detail-row"><span class="detail-key">XSW Suspected</span><span class="detail-val" style="color:${a.is_xsw_suspected ? 'var(--crit-fg)' : 'var(--low-fg)'}">${a.is_xsw_suspected ? '⚠ YES' : '✓ No'}</span></div>
          <div class="detail-row"><span class="detail-key">Assertions</span><span class="detail-val">${a.assertion_count} total / <span style="color:var(--low-fg)">${a.signed_assertion_count} signed</span> / <span style="color:${a.unsigned_assertion_count > 0 ? 'var(--high-fg)' : 'var(--muted)'}">${a.unsigned_assertion_count} unsigned</span></span></div>
          <div class="detail-row"><span class="detail-key">Signatures</span><span class="detail-val">${a.signature_count}</span></div>
          <div class="detail-row"><span class="detail-key">Duplicate IDs</span><span class="detail-val" style="color:${a.has_duplicate_ids ? 'var(--crit-fg)' : 'var(--muted)'}">${a.has_duplicate_ids ? '⚠ YES' : 'No'}</span></div>
          <div class="detail-row"><span class="detail-key">Variants</span><span class="detail-val">${variantChips}</span></div>

          <div style="font-size:10px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-top:12px;margin-bottom:4px">Parse Errors</div>
          ${c.parse_errors.length
            ? c.parse_errors.map(e => `<div class="dim" style="font-size:11px;padding:2px 0">⚠ ${e}</div>`).join('')
            : '<span class="dim">None</span>'}
        </div>
      </div>

      <div class="panel-header" style="margin-top:0">
        <span class="icon">◇</span> INDICATORS (${a.indicators.length})
      </div>
      ${indicatorItems}

      <div class="panel-header" style="margin-top:0">
        <span class="icon">◇</span> RAW XML
      </div>
      <div class="xml-viewer">${xmlPreview}</div>
    </div>`;
}

// ── Stats View ────────────────────────────────────────────────────────────
function renderStats() {
  const main = document.getElementById('main-content');
  const s = stats;
  if (!Object.keys(s).length) {
    main.innerHTML = '<div class="loading">Loading stats...</div>';
    return;
  }

  const variantRows = Object.entries(s.variant_breakdown || {}).map(([k, v]) =>
    `<div class="detail-row">
      <span class="detail-key">${k}</span>
      <span class="detail-val">
        ${v}
        <div class="score-bar-bg" style="width:160px;margin-top:4px">
          <div class="score-bar-fill" style="width:${Math.min(v * 10, 100)}%;background:var(--crit-fg)"></div>
        </div>
      </span>
    </div>`
  ).join('') || '<span class="dim">No XSW variants detected yet.</span>';

  main.innerHTML = `
    <div class="stats-grid">
      <div class="stat-card total">
        <div class="stat-label">Total Captures</div>
        <div class="stat-value">${s.total_captures || 0}</div>
        <div class="stat-sub">${s.unique_ips || 0} unique IPs</div>
      </div>
      <div class="stat-card xsw">
        <div class="stat-label">XSW Suspected</div>
        <div class="stat-value">${s.xsw_suspected || 0}</div>
        <div class="stat-sub">${s.unique_issuers || 0} unique issuers</div>
      </div>
      <div class="stat-card crit">
        <div class="stat-label">Critical</div>
        <div class="stat-value" style="color:var(--crit-fg)">${s.critical_count || 0}</div>
        <div class="stat-sub">Score ≥ 80</div>
      </div>
      <div class="stat-card ips">
        <div class="stat-label">High</div>
        <div class="stat-value" style="color:var(--high-fg)">${s.high_count || 0}</div>
        <div class="stat-sub">Score ≥ 50</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header"><span class="icon">◆</span> SEVERITY BREAKDOWN</div>
      <div style="padding:16px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
        ${[['CRITICAL','crit-fg',s.critical_count||0],['HIGH','high-fg',s.high_count||0],['MEDIUM','med-fg',s.medium_count||0],['LOW','low-fg',s.low_count||0]].map(([label, color, count]) => `
          <div style="text-align:center">
            <div style="font-family:'Syne',sans-serif;font-size:28px;font-weight:800;color:var(--${color})">${count}</div>
            <div style="font-size:10px;color:var(--muted);letter-spacing:.1em">${label}</div>
          </div>`).join('')}
      </div>
    </div>

    <div class="panel">
      <div class="panel-header"><span class="icon">◆</span> XSW VARIANT DISTRIBUTION</div>
      <div style="padding:16px">${variantRows}</div>
    </div>`;
}

// ── Utilities ─────────────────────────────────────────────────────────────
function truncate(s, n) {
  return s.length > n ? s.slice(0, n) + '…' : s;
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Init ──────────────────────────────────────────────────────────────────
loadAll();
setInterval(loadAll, 30_000); // auto-refresh every 30s
</script>
</body>
</html>
